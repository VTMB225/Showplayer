<script>
/* Kleine Sortier-Funktion (Maus + Touch) als Ersatz für SortableJS – nur was der Showplayer braucht */
(function(){
  if (window.Sortable) return;
  const lists = [];
  function Sortable(el, opt){
    this.el = el; this.opt = opt || {}; lists.push(this);
    el.addEventListener("pointerdown", e => this.down(e));
  }
  Sortable.prototype.down = function(e){
    const h = e.target.closest(this.opt.handle || "*"); if (!h || !this.el.contains(h) || e.button > 0) return;
    const item = h.closest("li"); if (!item || item.parentElement !== this.el) return;
    if (this.opt.filter && item.matches(this.opt.filter)) return;
    e.preventDefault();
    const self = this, ghost = this.opt.ghostClass || "sortable-ghost";
    item.classList.add(ghost);
    const same = lists.filter(l => l === self || (self.opt.group && l.opt.group === self.opt.group));
    let moved = false;
    function move(ev){
      const x = ev.clientX, y = ev.clientY;
      const under = document.elementFromPoint(x, y); if (!under) return;
      const target = same.find(l => l.el.contains(under) || l.el.closest("section,.col")?.contains(under));
      if (!target) return;
      const kids = [...target.el.children].filter(c => c !== item && !c.hidden && !(target.opt.filter && c.matches(target.opt.filter)));
      let before = null;
      for (const c of kids) { const r = c.getBoundingClientRect(); if (y < r.top + r.height/2) { before = c; break; } }
      if (before) { if (item.nextElementSibling !== before) { target.el.insertBefore(item, before); moved = true; } }
      else if (target.el.lastElementChild !== item) { target.el.appendChild(item); moved = true; }
      // am Rand automatisch scrollen
      const lr = target.el.getBoundingClientRect();
      if (y < lr.top + 30) target.el.scrollTop -= 12; else if (y > lr.bottom - 30) target.el.scrollTop += 12;
    }
    function up(){
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      item.classList.remove(ghost);
      if (moved && self.opt.onEnd) self.opt.onEnd({item});
    }
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  };
  window.Sortable = Sortable;
})();
</script>
<style>
/* Layout: Pult-Ansicht. Kopfzeile mit Veranstaltung, darunter Programm | Einwürfe nebeneinander (Handy: Tabs), unten fest das Abspiel-Deck. */
:root{
  --bg:#111418; --panel:#181c21; --raise:#20252c; --line:#2b313a; --fg:#e8eaed; --muted:#8d95a0;
  --amber:#f2a33a; --amber-ink:#1b1305; --cyan:#4ec3cf; --cyan-ink:#04191b; --red:#ec5f50; --ok:#5fc983;
  --f-display:"Barlow Condensed","Bahnschrift SemiCondensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceef1; --panel:#ffffff; --raise:#f4f5f7; --line:#d6dae0; --fg:#14171b; --muted:#5e6672;
  --amber:#b96d00; --amber-ink:#ffffff; --cyan:#0a7e8a; --cyan-ink:#ffffff; --red:#c63a2c; --ok:#24874a; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceef1; --panel:#ffffff; --raise:#f4f5f7; --line:#d6dae0; --fg:#14171b; --muted:#5e6672;
  --amber:#b96d00; --amber-ink:#ffffff; --cyan:#0a7e8a; --cyan-ink:#ffffff; --red:#c63a2c; --ok:#24874a; color-scheme:light}

html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}

/* Kopf */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:12px;flex:none;color:var(--fg)}
.brand .logo{display:block;height:58px;width:auto;aspect-ratio:905/496}
.brand .logo svg{display:block;height:100%;width:auto}
.brand .bname{font:700 13px/1.15 var(--f-display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding-left:12px;border-left:1px solid var(--line);color:var(--muted)}
.brand .bname b{display:block;color:var(--amber);font-weight:700}
.sidelogo{display:block;padding:18px 20px 14px;border-bottom:1px solid var(--line);color:var(--fg)}
.sidelogo svg{display:block;width:100%;height:auto}
@media (min-width:1051px){.brand .logo{display:none}.brand .bname{border-left:0;padding-left:0;font-size:16px}}
@media (max-width:1050px){.sidelogo{display:none}}
.evbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 12px;text-align:left}
.evbtn .n{font:600 17px/1.1 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evbtn .d{color:var(--muted);font-size:13px;white-space:nowrap}
.evbtn .car{margin-left:auto;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--amber)} .chip.bad i{background:var(--red)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:600 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ghost:hover{background:var(--raise)}

/* Hauptbereich */
.main{display:grid;grid-template-columns:270px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:0}
.side{grid-column:1;grid-row:1/3;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{grid-column:2;grid-row:1;display:flex;gap:4px;padding:10px 16px 0;background:var(--bg)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--amber)}
.tabs button.on.e{border-bottom-color:var(--cyan)}
.tabs button[data-t="pool"]{display:none}
#colRun,#colProg{grid-column:2;grid-row:2}
#colPool{grid-column:3;grid-row:1/3}
.main[data-tab="prog"] #colRun,.main[data-tab="run"] #colProg,.main[data-tab="pool"] #colRun{display:none}
.main[data-tab="pool"] #colProg{display:flex}

/* Ablauf */
.rd{display:grid;grid-template-columns:26px 58px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 8px;border-radius:10px;border:1px solid transparent}
.rd+.rd{margin-top:4px}
.rd:hover{background:var(--raise)}
.rd .h{height:28px}
.rd .tm{font:700 18px/1.5 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rd .bd{min-width:0;display:grid;gap:5px}
.rd .bd>b{font:600 19px/1.2 var(--f-display);letter-spacing:.01em;padding-top:2px}
.rd .nt{color:var(--muted);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rd .sgs{display:flex;flex-wrap:wrap;gap:6px}
.sc{display:inline-flex;align-items:center;gap:7px;max-width:100%;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;background:var(--panel);font-size:13.5px;font-weight:500;text-align:left}
.sc .pl{flex:none;width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}
.sc .pl svg{width:12px;height:12px;fill:currentColor}
.sc .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sc .du{font:500 11.5px/1 var(--f-mono);color:var(--muted)}
.sc.playing{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--panel))}
.sc.miss .pl{background:var(--line);color:var(--muted)}
.rd .flags{display:flex;gap:6px;flex-wrap:wrap}
.rd.nowpt{border-color:var(--amber)}
.rd.nowpt .tm{color:var(--amber)}
.rd.live{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 11%,var(--panel))}
.rd.done{opacity:.48}
.rd.done .bd>b{text-decoration:line-through;text-decoration-thickness:1px}
.ib.chk.on{color:var(--ok);border-color:var(--ok)}
.rd .btns{flex-direction:column}
.picks{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.picks label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px}
.picks label:hover{background:var(--raise)}
.picks input{width:18px;height:18px;accent-color:var(--amber)}
.picks .grp{font:700 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
.chkrow{display:flex;gap:10px;align-items:center}
.chkrow input{width:18px;height:18px;accent-color:var(--amber)}
.lbl2{font:700 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
#colPool{border-left:1px solid var(--line)}
.colhead{padding:14px 16px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border-bottom:1px solid var(--line)}
.colhead h2{margin:0;font:700 22px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.colhead .sub{color:var(--muted);font:500 13px/1 var(--f-mono)}
.colhead .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:8px 10px 24px;overflow:auto;flex:1;min-height:0}

/* Zeilen */
.row{display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;align-items:center;gap:6px;padding:8px 8px;border-radius:8px;border:1px solid transparent;user-select:none}
.row+.row{margin-top:2px}
.row:hover{background:var(--raise)}
.h{color:var(--muted);cursor:grab;touch-action:none;display:grid;place-items:center;height:36px;font-size:16px;letter-spacing:-2px}
.cue{font:700 15px/1 var(--f-mono);color:var(--muted);text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
.ti{min-width:0}
.ti b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti small{display:flex;gap:8px;align-items:center;color:var(--muted);font:500 12px/1.3 var(--f-mono);margin-top:2px;flex-wrap:wrap}
.tag{font:600 11px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;border:1px solid var(--line)}
.tag.stop{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.tag.miss{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.tag.q{background:var(--cyan);color:var(--cyan-ink);border-color:var(--cyan)}
.btns{display:flex;gap:4px}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.ib:hover{border-color:var(--muted)}
.ib svg{width:18px;height:18px;fill:currentColor}
.ib.go{color:var(--amber)} .ib.now{color:var(--cyan)}
.txtb{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.txtb.now{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink)}
.row.played{opacity:.5}
.row.next{border-color:var(--line);background:var(--raise)}
kbd,.kbd{font:700 11px/1 var(--f-mono);min-width:20px;height:20px;padding:0 5px;border-radius:4px;border:1px solid var(--line);border-bottom-width:2px;display:inline-grid;place-items:center;color:var(--muted);background:var(--panel)}
.row .cue .kbd{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,var(--line))}
.row.sel,.rd.sel{outline:2px dashed var(--cyan);outline-offset:-2px}
.hk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;align-items:center;font-size:14px}
.hk dt{display:flex;gap:4px;flex-wrap:wrap}
.hk dd{margin:0;color:var(--muted)}
.kbtn{background:none;border:1px dashed transparent;border-radius:6px;padding:3px;min-width:44px;text-align:left}
.kbtn:hover{border-color:var(--line)}
.kbtn kbd{font-size:13px;height:26px;min-width:30px;color:var(--fg)}
.kbtn.wait{border-color:var(--amber)}
.kbtn.wait kbd{border-color:var(--amber);color:var(--amber)}
.setrow{display:grid;gap:6px}
.setrow .lv{display:flex;justify-content:space-between;align-items:baseline}
.setrow .lv{gap:12px}
.setrow .lv b{font:700 20px/1 var(--f-mono);white-space:nowrap}
.setrow input[type=range]{width:100%;accent-color:var(--amber)}
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center}
.stepper button{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font:700 20px/1 var(--f-mono)}
.hbtn{display:none}
.xpre{display:flex;gap:6px;flex-wrap:wrap}
.xpre button{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font:600 14px/1 var(--f-mono)}
.xpre button.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
#xendBtn.on{border-color:var(--amber);color:var(--amber)}
.impmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.impwrap{overflow-x:auto;max-height:38vh;border:1px solid var(--line);border-radius:10px}
.imptbl{width:100%;border-collapse:collapse;font-size:13.5px}
.imptbl th{position:sticky;top:0;background:var(--raise);text-align:left;font:700 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px}
.imptbl td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.imptbl td:first-child{font-family:var(--f-mono);white-space:nowrap}
.imptbl .nt{color:var(--muted);font-size:12.5px}
.imptbl .ok{color:var(--ok)} .imptbl .no{color:var(--amber)}
.libsec{list-style:none;padding:12px 8px 4px}
.libsec.empty{margin:8px;padding:14px}
.libhit{grid-template-columns:26px 34px minmax(0,1fr) auto}
#progFilterWrap{padding:8px 10px 0}
.misslist{margin:0;padding-left:20px;max-height:30vh;overflow:auto;color:var(--fg)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:12px 10px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-align:center}
.seg button.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.plist{display:grid;gap:6px}
.plist button{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
.plist button.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
body.remote .deck{box-shadow:inset 0 3px 0 var(--cyan)}
@media (max-width:720px){#rc .lbl{display:none}}
.switch{display:flex;gap:10px;align-items:center;font-weight:500}
.switch input{width:20px;height:20px;accent-color:var(--amber)}
@media (max-width:720px){.hbtn{display:inline-grid}.libtxt{display:none}}
.row.next .cue{color:var(--amber)}
.row.cur{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 13%,var(--panel))}
.row.cur .cue{color:var(--amber)}
.row.curpool{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,var(--panel))}
.sortable-ghost{opacity:.35}
.empty{margin:18px 8px;padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);line-height:1.5}
.empty b{color:var(--fg)}
.col.drop{outline:2px dashed var(--amber);outline-offset:-6px}
.filter{width:100%;margin:0 0 4px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--raise)}
.filterwrap{padding:8px 10px 0}

/* Veranstaltungen */
.side h3{margin:0;padding:14px 16px 8px;font:700 14px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.evlist{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:8px;border:1px solid transparent}
.ev+.ev{margin-top:2px}
.ev>button.pick{background:none;border:0;text-align:left;padding:9px 10px;min-width:0}
.ev .n{font:600 17px/1.15 var(--f-display);letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .m{color:var(--muted);font-size:12.5px;display:block}
.ev:hover{background:var(--raise)}
.ev.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--panel))}
.ev .ib{width:34px;height:34px;margin-right:6px;background:transparent;border-color:transparent}
.ev .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:middle}
.newev{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.inp{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--raise);min-width:0}
.pri{background:var(--amber);color:var(--amber-ink);border:0;border-radius:8px;padding:10px 14px;font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.pri.cy{background:var(--cyan);color:var(--cyan-ink)}
.pri.red{background:var(--red);color:#fff}
.sec{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}

/* Deck */
.deck{background:var(--panel);border-top:1px solid var(--line);padding:0 16px 12px}
.seek{width:100%;margin:0;height:22px;display:block;accent-color:var(--amber);cursor:pointer}
.deckrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px}
.dcenter{display:flex;align-items:center;gap:20px}
.dnext{min-width:0;text-align:right}
.now{min-width:0}
.now .src{font:700 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.now .src.p{color:var(--amber)} .now .src.e{color:var(--cyan)}
.now .t{font:600 22px/1.15 var(--f-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}
.nx{color:var(--muted);font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nx b{color:var(--fg);font-weight:600;display:block;font:600 17px/1.2 var(--f-display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{text-align:right;font-variant-numeric:tabular-nums}
.tc .rem{font:700 34px/1 var(--f-mono);letter-spacing:-.02em}
.tc .el{font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.tc.warn .rem{color:var(--red)}
.transport{display:flex;gap:8px;align-items:center}
.tb{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;padding:0}
.tb svg{width:22px;height:22px;fill:currentColor}
.tb.play{width:64px;height:64px;background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tb.play svg{width:28px;height:28px}
.tb.fade{width:auto;padding:0 12px;font:700 14px/1 var(--f-display);letter-spacing:.1em}
.tb.on{border-color:var(--amber);color:var(--amber)}
.auto{display:flex;align-items:center;gap:6px;font:600 12px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:8px 8px;background:transparent;height:52px;justify-content:center}
.auto.on{color:var(--amber);border-color:var(--amber)}
.lvl{margin-top:4px;font:500 12px/1.3 var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl b{font-weight:700;color:var(--fg)} .lvl .lp{color:var(--amber)} .lvl .le{color:var(--cyan)}
.lvl .mi{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:1px}
.lvl .mi.on{background:var(--ok)} .lvl .mi.hit{background:var(--amber)}
.mixrow{display:grid;grid-template-columns:120px minmax(0,1fr) 58px;gap:10px;align-items:center}
.mixrow input[type=range]{width:100%;accent-color:var(--amber)}
.mixrow.e input[type=range]{accent-color:var(--cyan)}
.mixrow b{font:700 16px/1 var(--f-mono);text-align:right}
.mixrow .ml{font:600 15px/1.1 var(--f-display);letter-spacing:.03em}
.mixrow small{display:block;color:var(--muted);font:500 11.5px/1.2 var(--f-mono)}

/* Overlay */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:end center;z-index:50;padding:16px}
@media (min-width:700px){.scrim{place-items:center}}
.sheet{width:min(560px,100%);max-height:min(82vh,760px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h4{margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.sheet p{margin:0;color:var(--muted)}
.menu{display:grid;gap:6px}
.menu button{text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-weight:500}
.menu button.danger{color:var(--red)}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lib{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:46vh;overflow:auto}
.lib label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:8px}
.lib label:hover{background:var(--raise)}
.lib input{width:18px;height:18px;accent-color:var(--amber)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.busy{font:500 12px/1 var(--f-mono);color:var(--muted)}
.hide-wide{display:none}

/* Tablet: Veranstaltungen als Schublade */
@media (max-width:1050px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tabs{grid-column:1}
  #colRun,#colProg{grid-column:1}
  #colPool{grid-column:2}
  .side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(330px,88vw);transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 40px rgba(0,0,0,.35)}
  .side.open{transform:none}
  .hide-wide{display:inline-flex}
}
/* Handy: drei Tabs */
@media (max-width:720px){
  .top{flex-wrap:wrap}
  .brand{order:-1;width:100%;justify-content:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .brand .logo{height:52px}
  .brand .bname{display:none}
  .top{padding:8px 12px;gap:8px}
  .main{grid-template-columns:minmax(0,1fr)}
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;padding:0;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabs button{padding:11px 4px;font-size:14px}
  .tabs button[data-t="pool"]{display:block}
  #colPool{grid-column:1;grid-row:2;border-left:0}
  .main[data-tab="run"] #colPool,.main[data-tab="prog"] #colPool,.main[data-tab="pool"] #colProg,.main[data-tab="pool"] #colRun{display:none}
  .colhead{padding:10px 12px 8px}
  .colhead h2{font-size:19px}
  .list{padding:6px 6px 20px}
  .row{grid-template-columns:22px 28px minmax(0,1fr) auto;gap:4px;padding:7px 4px}
  .rd{grid-template-columns:20px 48px minmax(0,1fr) auto;gap:6px;padding:9px 4px}
  .rd .tm{font-size:16px}
  .txtb{padding:0 8px;font-size:12px}
  .row .ib[data-more]{width:32px}
  .deck{padding:0 12px 10px}
  .deckrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"now tc" "nx nx" "tr tr";gap:6px 10px}
  .dcenter{display:contents}
  .now{grid-area:now} .tc{grid-area:tc} .dnext{grid-area:nx;text-align:left} .transport{grid-area:tr;justify-content:center;margin-top:4px}
  .nx b{display:inline;font:600 13px/1.35 var(--f-body)}
  .now .t{font-size:19px}
  .tc .rem{font-size:28px}
  .tb{width:48px;height:48px}
  .tb.play{width:60px;height:60px}
  .chip .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
/* Platz für das Netlify-Zeichen unten rechts freihalten */
@media (min-width:721px){ .on-netlify .deck{padding-right:250px} }
@media (max-width:720px){ .on-netlify .deck{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))} }
</style>
</head>

      <h3>Veranstaltungen</h3>
      <ul class="evlist" id="evList"></ul>
      <form class="newev" id="newEv">
        <input class="inp" id="newEvName" placeholder="z. B. Hochzeit Meier – Festhalle" required>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px">
          <input class="inp" type="date" id="newEvDate">
          <button class="pri" type="submit">Anlegen</button>
        </div>
      </form>
    </aside>

    <nav class="tabs" id="tabs">
      <button data-t="run">Ablauf</button>
      <button data-t="prog">Programm</button>
      <button data-t="pool" class="e">Einwürfe</button>
    </nav>

    <section class="col" id="colRun">
      <div class="colhead">
        <h2>Ablauf</h2>
        <span class="sub" id="runSum"></span>
        <div class="acts">
          <button class="ghost" data-imp="run" title="Ablauf aus Word oder Excel übernehmen">Word/Excel</button>
          <button class="ghost" id="runAdd">+ Punkt</button>
        </div>
      </div>
      <ol class="list" id="runList"></ol>
    </section>

    <section class="col" id="colProg" data-target="program">
      <div class="colhead">
        <h2>Programm</h2>
        <span class="sub" id="progSum"></span>
        <div class="acts">
          <button class="ghost" data-add="program">+ Dateien</button>
          <button class="ghost" data-lib="program">Aus Bibliothek</button>
          <button class="ghost" data-imp="prog" title="Liedreihenfolge aus Word oder Excel übernehmen">Word/Excel</button>
          <button class="ghost" id="xendBtn" title="Überblendung zwischen zwei Liedern">Übergang: aus</button>
        </div>
      </div>
      <div class="filterwrap" id="progFilterWrap"><input class="filter" id="progFilter" placeholder="Lied suchen … (Enter spielt den ersten Treffer)" type="search" autocomplete="off"></div>
      <ol class="list" id="progList"></ol>
    </section>

    <section class="col" id="colPool" data-target="pool">
      <div class="colhead">
        <h2 style="color:var(--cyan)">Einwürfe</h2>
        <span class="sub" id="poolSum"></span>
        <div class="acts">
          <button class="ghost" data-add="pool">+ Dateien</button>
          <button class="ghost" data-lib="pool">Aus Bibliothek</button>
        </div>
      </div>
      <div class="filterwrap" id="poolFilterWrap" hidden><input class="filter" id="poolFilter" placeholder="Einwurf suchen …" type="search"></div>
      <ul class="list" id="poolList"></ul>
    </section>
  </div>

  <footer class="deck">
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Position im Lied">
    <div class="deckrow">
      <div class="now">
        <div class="src" id="nowSrc">Bereit</div>
        <div class="t" id="nowT">Kein Lied geladen</div>
      </div>
      <div class="dcenter">
      <div class="tc" id="tc"><div class="rem" id="tcRem">0:00</div><div class="el" id="tcEl">0:00 / 0:00</div></div>
      <div class="transport">
        <button class="tb" id="bRestart" title="Lied neu starten" aria-label="Lied neu starten"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 19 5v14z"/></svg></button>
        <button class="tb play" id="bPlay" title="Abspielen / Pause (Leertaste)" aria-label="Abspielen"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="tb" id="bNext" title="Nächstes Lied (N)" aria-label="Nächstes Lied"><svg viewBox="0 0 24 24"><path d="M5 5v14l9.5-7zM16 5h2v14h-2z"/></svg></button>
        <button class="tb fade" id="bFade" title="Ausblenden und stoppen (↓)">FADE <span id="fadeLbl" style="font-family:var(--f-mono);font-size:12px;opacity:.75">3s</span></button>
        <button class="tb" id="bStop" title="Stopp" aria-label="Stopp"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
        <button class="auto on" id="bAuto" title="Nach jedem Lied automatisch weiter">Auto<br>weiter</button>
        <button class="auto" id="bMix" title="Lautstärke: Gesamt, Programm, Einwürfe">Laut-<br>stärke</button>
      </div>
      </div>
      <div class="dnext"><div class="nx" id="nowNx"></div><div class="lvl" id="lvlTxt"></div></div>
    </div>
  </footer>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const MAX_SYNC = 14.5 * 1024 * 1024; // größer passt nicht in den Online-Speicher
const SETTING_KEYS = ["keys","fade","xfade","xend","auto"];
const ls = { get(k,d){ try{ const v = localStorage.getItem("sp_"+k); return v==null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{ localStorage.setItem("sp_"+k, JSON.stringify(v)); }catch{} if (SETTING_KEYS.includes(k)) { try { localStorage.setItem("sp_settingsAt", String(Date.now())); } catch {} scheduleDirSave(); odSchedule(); } } };

/* ---------- Lokaler Speicher (IndexedDB) ---------- */
let idb = null;
const memAudio = new Map();
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open("showplayer", 1);
  r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("recs", {keyPath:"id"}); d.createObjectStore("audio"); d.createObjectStore("kv"); };

let coll = null, assets = null, flushing = false, flushT = null, uploading = false, online = navigator.onLine, syncErr = false;
function scheduleFlush(ms=700){ clearTimeout(flushT); flushT = setTimeout(flush, ms); setSync(); }
async function flush(){
  if (!coll || flushing || !dirty.size) { setSync(); return; }
  flushing = true; let progress = false;
  try {
    for (const id of [...dirty]) {
      const r = recs.get(id); if (!r) { dirty.delete(id); continue; }
      try { await coll.doc(id).set(JSON.parse(JSON.stringify(r))); dirty.delete(id); progress = true; syncErr = false; }
      catch (e) { if (e && (e.code==="invalid_argument" || e.code==="quota_exceeded")) { dirty.delete(id); toast(e.code==="quota_exceeded" ? "Online-Speicher ist voll. Änderung bleibt nur auf diesem Gerät." : "Eine Änderung konnte nicht abgeglichen werden."); } else { syncErr = true; break; } }
    }
  } finally { flushing = false; ls.set("dirty",[...dirty]); setSync(); }
  if (dirty.size) setTimeout(flush, progress ? 300 : 20000);
}
function mergeRemote(d){
  if (!d || !d.id || !d.kind) return false;
  const l = recs.get(d.id);
  if (l && (l.updated||0) >= (d.updated||0)) return false;
  const c = JSON.parse(JSON.stringify(d)); recs.set(c.id, c); if (idb) iPut("recs", c).catch(()=>{}); dirty.delete(c.id); return true;
}

const toB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
function fromB64(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }

async function uploadLoop(){
  if (!assets || uploading || !online) return;
  uploading = true; setSync();
  try {
    for (const s of songs()) {
      if (s.asset || s.big || !audioKeys.has(s.id)) continue;
      const blob = await audioGet(s.id); if (!blob) continue;
      if (blob.size > MAX_SYNC) { s.big = true; save(s); continue; }
      try {
        const b64 = await toB64(blob);
        const r = await assets.upload(new Blob([b64], {type:"text/plain"}), {type:"text/plain"});
        const cur = recs.get(s.id); if (cur) { cur.asset = r.id; save(cur); }
      } catch (e) {
        const c = e && e.code;
        if (c==="too_large") { s.big = true; save(s); continue; }
        if (c==="quota_or_state") { toast("Online-Speicher ist voll. Neue Lieder bleiben auf diesem Gerät."); break; }
        break; // später erneut versuchen
      }
    }
  } finally { uploading = false; setSync(); render(); }
}
async function ensureAudio(s){
  if (audioKeys.has(s.id)) { const b = await audioGet(s.id); if (b) return b; }
  if (dirOk && songFiles.has(s.id)) {
    const fh = await (await dir.getDirectoryHandle("Lieder")).getFileHandle(songFiles.get(s.id));
    const f = await fh.getFile(); const blob = new Blob([await f.arrayBuffer()], {type: s.mime || f.type || "audio/mpeg"});
    await audioPut(s.id, blob); return blob;
  }
  if (s.od && auth.connected() && navigator.onLine) { const blob = await odDownloadSong(s); await audioPut(s.id, blob); return blob; }
  if (!s.asset) throw new Error("missing");
  const r = await fetch("/_blob/" + s.asset); if (!r.ok) throw new Error("fetch");
  const blob = new Blob([fromB64((await r.text()).trim())], {type: s.mime || "audio/mpeg"});
  await audioPut(s.id, blob); return blob;
}

function readDur(blob){ return new Promise(res => { const a = new Audio(); const u = URL.createObjectURL(blob); let done = false; const fin = d => { if (done) return; done = true; URL.revokeObjectURL(u); res(d); };
  a.preload = "metadata"; a.onloadedmetadata = () => fin(isFinite(a.duration) ? a.duration : 0); a.onerror = () => fin(0); setTimeout(() => fin(0), 5000); a.src = u; }); }
async function addFiles(files, target){
  const e = ev(); if (!e) { toast("Lege zuerst eine Veranstaltung an."); openSide(); return; }
  const list = [...files].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name));
  if (!list.length) { toast("Keine Audiodateien gefunden."); return; }
  toast(list.length === 1 ? "Lied wird hinzugefügt …" : list.length + " Lieder werden hinzugefügt …");
  for (const f of list) {
    const title = stripId(f.name.replace(/\.[^.]+$/, "").replace(/_/g," ").trim()) || "Lied";
    const idm = f.name.match(/\[([a-z0-9]{8,})\]\.[^.]+$/i), known = idm && song(idm[1]) && !song(idm[1]).deleted ? song(idm[1]) : null;
    let s = known || songs().find(x => x.fname === f.name && x.size === f.size);
    if (!s) {
      s = {id: uid("s"), kind:"song", title, fname:f.name, size:f.size, mime: f.type || guessMime(f.name), dur: 0, asset:null};
      await audioPut(s.id, f); s.dur = await readDur(f); save(s); await dirWriteAudio(s, f);
    } else if (!audioKeys.has(s.id)) { await audioPut(s.id, f); if (!songFiles.has(s.id)) await dirWriteAudio(s, f); }
    if (impPlace(e, s, target)) { /* aus einem Import zugeordnet */ }
    else if (target === "program") e.program.push({k: uid("k"), sid: s.id, stop:false});
    else if (target.startsWith("run:")) { const pt = rd(e).find(x => x.k === target.slice(4)); if (pt && !pt.songs.includes(s.id)) pt.songs.push(s.id); }
    else e.pool.push({k: uid("k"), sid: s.id});
  }
  save(e); render(); uploadLoop();
}

async function prepareOffline(e){

  for (const id of ids) { const s = song(id); toast(`Lade ${ok+fail+1} von ${ids.length} …`, 60000); try { await ensureAudio(s); ok++; } catch { fail++; } }
  render(); toast(fail ? `${ok} geladen, ${fail} fehlen (nur auf dem Gerät, auf dem sie hinzugefügt wurden).` : `${ok} Lieder sind jetzt offline verfügbar.`, 5000);

async function scanSongs(){ try { const ld = await dir.getDirectoryHandle("Lieder", {create:true}); for await (const [name, e] of ld.entries()) { if (e.kind !== "file") continue; const m = name.match(/\[([a-z0-9]+)\]\.[^.]+$/i); if (m) songFiles.set(m[1], name); } } catch {} }
// Änderungen von außen (z. B. OneDrive vom anderen PC) übernehmen
async function pullExternal(){
  const f = await dataFile(); if (!f || f.lastModified <= dirSeen) return false;
  let j; try { j = JSON.parse(await f.text()); } catch { return false; }
  dirSeen = f.lastModified;

setInterval(() => { if (dirOk && !dirSaving && document.visibilityState === "visible") pullExternal().catch(()=>{}); }, 15000);
const DATA = "showplayer-daten.json";
const safeName = n => n.replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").replace(/\s+/g, " ").trim().slice(0, 80) || "Lied";
function scheduleDirSave(){ if (!dirOk) return; clearTimeout(dirT); dirT = setTimeout(dirSave, 600); }
async function writeFile(dh, name, data){ const fh = await dh.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(data); await w.close(); }
function settingsObj(){ return {keys: ls.get("keys", null), fade: ls.get("fade", 3), xfade: ls.get("xfade", 1.2), xend: ls.get("xend", 0), auto: ls.get("auto", true), at: +ls.get("settingsAt", 0)}; }
async function dirSave(){
  if (!dirOk) return; if (dirSaving) { dirAgain = true; return; }
  dirSaving = true; dirBusy = true; setSync();
  try { await pullExternal();
    await writeFile(dir, DATA, JSON.stringify({app:"showplayer", version:1, saved: Date.now(), settings: settingsObj(), recs: [...recs.values()]}));
    const f = await dataFile(); if (f) dirSeen = f.lastModified; dirErr = false; }
  catch { dirErr = true; }

}
async function dirWriteAudio(s, blob){
  if (!dirOk || !s) return;
  try { const ld = await dir.getDirectoryHandle("Lieder", {create:true}); const ext = (s.fname.match(/\.[a-z0-9]+$/i) || [".mp3"])[0];
    const name = safeName(s.fname.replace(/\.[^.]+$/, "")) + " [" + s.id + "]" + ext; await writeFile(ld, name, blob); songFiles.set(s.id, name); dirErr = false; }
  catch { dirErr = true; setSync(); }
}
async function pickDir(){
  if (!window.showDirectoryPicker) { toast("Dieser Browser kann keine Ordner verwenden. Bitte Edge oder Chrome nehmen.", 5000); return; }
  let h; try { h = await window.showDirectoryPicker({id:"showplayer", mode:"readwrite"}); } catch { return; }
  await connectDir(h, true);
}
async function connectDir(h, ask){
  if (!h) return false;
  try {
    let perm = h.queryPermission ? await h.queryPermission({mode:"readwrite"}) : "granted";
    if (perm !== "granted" && ask && h.requestPermission) perm = await h.requestPermission({mode:"readwrite"});
    if (perm !== "granted") { dirHandle = h; setSync(); return false; }
    dirHandle = h; dir = h; dirName = h.name; if (idb) { try { await iPut("kv", h, "dir"); } catch {} }
    // vorhandene Daten im Ordner lesen und nach Änderungszeit zusammenführen
    let file = null;
    try { const f = await (await h.getFileHandle(DATA)).getFile(); file = JSON.parse(await f.text()); dirSeen = f.lastModified; } catch { file = null; }
    if (file && Array.isArray(file.recs)) {
      try { await writeFile(h, "showplayer-daten.sicherung.json", JSON.stringify(file)); } catch {}
      for (const d of file.recs) mergeRemote(d);
      const st = file.settings; if (st && (st.at||0) > +ls.get("settingsAt", 0)) {
        try { if (st.keys) localStorage.setItem("sp_keys", JSON.stringify(st.keys)); localStorage.setItem("sp_fade", JSON.stringify(st.fade)); localStorage.setItem("sp_xfade", JSON.stringify(st.xfade)); if (st.xend != null) localStorage.setItem("sp_xend", JSON.stringify(st.xend)); localStorage.setItem("sp_auto", JSON.stringify(st.auto)); localStorage.setItem("sp_settingsAt", String(st.at)); } catch {}
        keymap = Object.assign(Object.fromEntries(ACTIONS.map(a=>[a[0],a[2]])), st.keys || {}); fadeSec = st.fade ?? fadeSec; xSec = st.xfade ?? xSec; xEnd = st.xend ?? xEnd; auto = st.auto ?? auto;
      }
    }
    songFiles.clear(); await scanSongs();
    dirOk = true; dirErr = false;
    if (!ev()) curEv = events()[0]?.id || null;
    render(); await dirSave();
    // Lieder, die nur in diesem Browser liegen, in den Ordner kopieren
    const missing = songs().filter(s => audioKeys.has(s.id) && !songFiles.has(s.id));
    for (let i = 0; i < missing.length; i++) { toast(`Kopiere Lieder in den Ordner: ${i+1} von ${missing.length} …`, 60000); const b = await audioGet(missing[i].id); if (b) await dirWriteAudio(missing[i], b); }
    if (missing.length) toast("Alle Lieder liegen jetzt im Ordner.");
    else toast(file ? "Daten aus „" + dirName + "“ geladen." : "Ordner „" + dirName + "“ verbunden.");
    render(); return true;
  } catch { dirErr = true; dirOk = false; setSync(); toast("Ordner nicht erreichbar. Ist der USB-Stick eingesteckt?", 4500); return false; }
}
window.addEventListener("focus", () => { if (dirOk && !dirSaving) pullExternal().catch(()=>{}); });

/* ---------- Fernbedienung: direkte Verbindung (WebRTC), Verbindungsaufbau über OneDrive ---------- */
const guessName = () => { const u = navigator.userAgent; if (/iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) return "iPad"; if (/iPhone/.test(u)) return "iPhone"; if (/Windows/.test(u)) return "Laptop"; if (/Mac/.test(u)) return "Mac"; return "Gerät"; };
const devId = (() => { let v = ls.get("devid", null); if (!v) { v = uid("d").toLowerCase().replace(/[^a-z0-9]/g, ""); ls.set("devid", v); } return v; })();

const R = {role: ls.get("role", "player"), name: ls.get("devname", guessName()), allow: ls.get("rcAllow", false),

async function odItemJson(it){ const r = await fetch(it["@microsoft.graph.downloadUrl"]); if (!r.ok) throw new Error("get " + r.status); return r.json(); }
const odPutJson = (path, obj) => odPutBlob(path, new Blob([JSON.stringify(obj)], {type: "application/json"}), "application/json");

function stateObj(){
  const st = player.evId ? stOf(player.evId) : null;
  return {evId: player.evId || null, sid: player.sid, k: player.k, src: player.src, halted: !!player.halted, pend: player.pend || null, paused: au.paused, t: Math.round((au.currentTime || 0) * 10) / 10, d: Math.round((au.duration || 0) * 10) / 10,
    auto, fade: fadeSec, xend: xEnd, vol, ready: activated(), lastKey: st?.lastKey || null, lastIdx: st?.lastIdx ?? -1, played: st ? [...st.played].slice(-150) : [], queue: st ? st.queue.slice(0, 30) : []};

function pushState(force){

  const st = stateObj(), key = JSON.stringify(st); if (!force && key === R.pushLast) return; R.pushLast = key;
  for (const e of R.peers.values()) chSend(e.ch, {t: "state", st});
}

  if (st.evId) { const s2 = stOf(st.evId); s2.lastKey = st.lastKey; s2.lastIdx = st.lastIdx ?? -1; s2.played = new Set(st.played || []); s2.queue = st.queue || []; if (!curEv || !evById(curEv)) curEv = st.evId; }

function execCmd(d){
  switch (d.a) {
    case "toggle": actToggle(); break;
    case "next": _goNext(); break;
    case "restart": actRestart(); break;
    case "stop": actStop(); break;
    case "fade": actFade(); break;
    case "auto": actAuto(); break;
    case "xend": setXend(d.v); break;
    case "vol": if (["m","p","e"].includes(d.ch)) setLevel(d.ch, +d.v || 0); break;
    case "seek": if (au.duration) au.currentTime = Math.max(0, Math.min(1, +d.f || 0)) * au.duration; break;
    case "prog": _playProg(String(d.k), String(d.ev)); break;
    case "pool": _playNow(String(d.k), String(d.ev)); break;
    case "queue": _toggleQueue(String(d.k), String(d.ev)); break;
    case "run": _playRun(String(d.pk), String(d.sid), String(d.ev)); break;

/* Player: meldet sich in OneDrive als erreichbar und nimmt Verbindungswünsche an */
let polling = false;
async function playerPoll(){
  if (polling || R.role !== "player" || !R.allow || !rcOk()) return;
  polling = true;
  try {
    if (Date.now() - R.hb > 20000) { R.hb = Date.now(); await odPutJson("remote/player-" + devId + ".json", {id: devId, name: R.name, t: Date.now()}); }
    for (const it of await odListRemote()) {
      const m = it.name.match(/^offer-([a-z0-9]+)-([a-z0-9]+)\.json$/i); if (!m || m[2] !== devId || R.seen.has(m[1])) continue;
      R.seen.add(m[1]);
      let o = null; try { o = await odItemJson(it); } catch {}
      odDelete("remote/" + it.name).catch(() => {});
      if (o && o.sdp && Date.now() - (o.t || 0) < 120000) acceptOffer(m[1], o).catch(() => {});
    }
  } catch {} finally { polling = false; }
}
async function acceptOffer(nonce, o){
  const pc = new RTCPeerConnection(RTC_CFG), entry = {pc, ch: null, name: String(o.name || "Fernbedienung").slice(0, 30)};
  R.peers.set(nonce, entry);
  const drop = () => { if (R.peers.get(nonce) === entry) { R.peers.delete(nonce); setRc(); } };
  pc.ondatachannel = ev2 => { const ch = ev2.channel; entry.ch = ch;
    ch.onopen = () => { setRc(); R.pushLast = ""; pushState(true); toast(entry.name + " ist als Fernbedienung verbunden."); };
    ch.onclose = drop;
    ch.onmessage = m => { let d; try { d = JSON.parse(m.data); } catch { return; } if (d && d.t === "cmd" && typeof d.a === "string") execCmd(d); };
  };
  pc.onconnectionstatechange = () => { if (["failed", "closed"].includes(pc.connectionState)) drop(); };
  await pc.setRemoteDescription({type: "offer", sdp: o.sdp});
  await pc.setLocalDescription(await pc.createAnswer());
  await iceDone(pc);
  await odPutJson("remote/answer-" + nonce + ".json", {sdp: pc.localDescription.sdp, name: R.name, t: Date.now()});
}

/* Fernbedienung: Player suchen und direkt verbinden */
async function findPlayers(){
  const out = [];
  for (const it of await odListRemote()) {
    const m = it.name.match(/^player-([a-z0-9]+)\.json$/i); if (!m || m[1] === devId) continue;
    if (Date.now() - Date.parse(it.lastModifiedDateTime || 0) > 90000) continue;
    try { const j = await odItemJson(it); out.push({id: m[1], name: String(j.name || "Player").slice(0, 30)}); } catch {}
  }
  R.players = out; return out;
}
function closeRemote(){ try { R.pc?.close(); } catch {} R.pc = null; R.ch = null; R.connected = false; R.connecting = false; R.mirror = null; }
async function remoteConnect(){
  if (!isRemote() || R.connected || R.connecting) return;
  if (!rcOk()) { setRc(); return; }
  R.connecting = true; setRc();
  let pc = null, nonce = "";
  try {
    const ps = await findPlayers();
    const t = ps.find(p => p.id === R.target) || ps[0];
    if (!t) { R.connecting = false; setRc(); toast("Kein Player gefunden. Am Laptop in den Einstellungen „Fernbedienung erlauben“ einschalten.", 5000); return; }
    R.target = t.id; R.targetName = t.name; ls.set("rcTarget", t.id);
    nonce = uid("n").toLowerCase().replace(/[^a-z0-9]/g, "");
    pc = new RTCPeerConnection(RTC_CFG); const ch = pc.createDataChannel("sp");
    R.pc = pc; R.ch = ch;
    ch.onopen = () => { R.connected = true; R.connecting = false; setRc(); render(); toast("Verbunden mit " + R.targetName + "."); };
    ch.onclose = () => { if (R.ch !== ch) return; closeRemote(); Object.assign(player, {sid: null, k: null, src: null}); setRc(); render(); if (isRemote()) setTimeout(remoteConnect, 3000); };
    ch.onmessage = m => { let d; try { d = JSON.parse(m.data); } catch { return; } if (d && d.t === "state" && d.st && typeof d.st === "object") { applyMirror(d.st); render(); setRc(); } };
    await pc.setLocalDescription(await pc.createOffer()); await iceDone(pc);
    await odPutJson(`remote/offer-${nonce}-${R.target}.json`, {sdp: pc.localDescription.sdp, name: R.name, t: Date.now()});
    let ans = null;
    for (let i = 0; i < 40 && !ans && R.pc === pc; i++) {
      await new Promise(r => setTimeout(r, 1000));
      const r = await fetch(odPath("remote/answer-" + nonce + ".json"), {headers: {Authorization: "Bearer " + await auth.token()}});
      if (r.ok) { try { ans = await odItemJson(await r.json()); } catch {} }
    }
    if (R.pc !== pc) return;
    if (!ans) { closeRemote(); setRc(); odDelete(`remote/offer-${nonce}-${R.target}.json`).catch(() => {}); toast(R.targetName + " antwortet nicht. Ist dort die App offen und „Fernbedienung erlauben“ an?", 6000); return; }
    odDelete("remote/answer-" + nonce + ".json").catch(() => {});
    await pc.setRemoteDescription({type: "answer", sdp: ans.sdp});
    setTimeout(() => { if (R.pc === pc && !R.connected) { closeRemote(); setRc(); toast("Direkte Verbindung kam nicht zustande. Sind beide Geräte im selben WLAN?", 6000); } }, 15000);
  } catch (e) { if (R.pc === pc) closeRemote(); setRc(); toast(e && e.needLogin ? "Bitte zuerst mit OneDrive verbinden." : "Verbindung fehlgeschlagen. Neuer Versuch über die Anzeige oben.", 5000); }
}
function send(cmd){
  if (!R.connected) { toast(R.connecting ? "Verbindung wird aufgebaut …" : "Nicht mit dem Player verbunden."); if (!R.connecting) remoteConnect(); return; }
  if (R.mirror && R.mirror.ready === false) toast("Am " + R.targetName + " einmal in den Showplayer klicken, damit er abspielen darf.", 4500);
  chSend(R.ch, {t: "cmd", ...cmd});
}
function setRc(){
  const el = $("#rc");
  document.body.classList.toggle("remote", isRemote());
  if (!isRemote() && !R.allow) { el.hidden = true; return; }
  el.hidden = false; let txt, cls;
  if (isRemote()) {
    if (R.connected) { txt = R.mirror && R.mirror.ready === false ? R.targetName + ": dort 1× klicken" : "Fernbedienung → " + R.targetName; cls = R.mirror && R.mirror.ready === false ? "warn" : "ok"; }

  } else {
    const n = [...R.peers.values()].filter(e => e.ch && e.ch.readyState === "open").length;
    if (n && !activated()) { txt = "Hier 1× klicken für Fernbedienung"; cls = "warn"; }
    else { txt = "Player" + (n ? " · " + n + (n === 1 ? " Fernbedienung" : " Fernbedienungen") : " · wartet auf Fernbedienung"); cls = n ? "ok" : ""; }
  }
  el.className = "chip " + cls; el.querySelector(".lbl").textContent = txt; el.title = txt;
}
$("#rc").addEventListener("click", () => { unlock(); if (isRemote() && !R.connected) remoteConnect(); else { pushState(true); settingsSheet(); } setRc(); });
document.addEventListener("pointerdown", () => { if (R.role === "player") { unlock(); if (R.peers.size) { R.pushLast = ""; pushState(true); setRc(); } } }, true);

function setRole(role){

  else { for (const e of R.peers.values()) { try { e.pc.close(); } catch {} } R.peers.clear(); }

/* ---------- Übergang: Überblendung beim automatischen Weiterlaufen ---------- */
const fmtSec = v => String(Math.round(v * 10) / 10).replace(".", ",");
let crossing = false;
const remoteNow = () => typeof isRemote === "function" && isRemote();
const xendVal = () => remoteNow() && typeof R !== "undefined" && R.mirror && R.mirror.xend != null ? R.mirror.xend : xEnd;
function setXend(v){ xEnd = Math.min(15, Math.max(0, Math.round((+v || 0) * 2) / 2)); ls.set("xend", xEnd); renderDeck(); }
function cleanupDeck(d){ if (!d) return; try { d.pause(); } catch {} if (d._url) { URL.revokeObjectURL(d._url); d._url = null; } d.removeAttribute("src"); try { d.load(); } catch {} setVol(1, d); }
function rampDeck(d, to, sec){ return new Promise(res => {
  const g = gains.get(d);
  if (g && actx) { const now = actx.currentTime; g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(to, now + sec); setTimeout(res, sec * 1000 + 30); return; }
  const from = getVol(d), t0 = performance.now();
  const iv = setInterval(() => { const p = Math.min(1, (performance.now() - t0) / (sec * 1000)); setVol(Math.max(0, Math.min(1, from + (to - from) * p)), d); if (p >= 1) { clearInterval(iv); res(); } }, 40);
}); }
// Was nach dem aktuellen Lied automatisch käme (gleiche Regeln wie am Liedende)
function autoNextTarget(){
  const e = recs.get(player.evId);
  if (e && player.src === "run") {
    const p = rd(e).find(x => x.k === player.k);
    if (p) { const i = p.songs.indexOf(player.sid); const nx = p.songs.slice(i + 1).find(id => song(id) && !song(id).deleted); if (p.stop) return null; if (nx) return {e, it: {k: p.k, sid: nx}, src: "run"}; }
    return auto ? nextUp() : null;
  }
  const it = e && player.src === "prog" ? e.program.find(i => i.k === player.k) : null;
  if (it && it.stop) return null;
  return auto ? nextUp() : null;
}
function checkCross(){
  if (crossing || !(xEnd > 0) || !player.sid || au.paused || remoteNow()) return;
  const d = au.duration; if (!isFinite(d) || d <= 0) return;
  const left = d - au.currentTime, len = Math.min(xEnd, d / 3);
  if (left > len + 0.15) return;
  const n = autoNextTarget(); if (!n) return;
  crossing = true;
  start(n.e, n.it, n.src, {cross: left});
}
function xendLabel(){ const v = xendVal(); return v > 0 ? "Übergang " + fmtSec(v) + " s" : "Übergang: aus"; }
function xendSheet(){
  const v0 = xendVal(), presets = [0, 2, 4, 6, 8, 10];
  sheet(`<h4>Übergang zwischen Liedern</h4>
    <p>So lange überlappen sich zwei Lieder, wenn das Programm automatisch weiterläuft: Das alte Lied wird aus-, das neue gleichzeitig eingeblendet.</p>
    <div class="setrow"><span class="lv"><span class="lbl2">Überlappung</span><b id="xeV">${v0 > 0 ? fmtSec(v0) + " s" : "aus"}</b></span>

document.addEventListener("click", ev2 => { const b = ev2.target.closest("[data-imp]"); if (b) impOpen(b.dataset.imp); });

// Kennung aus Dateinamen des Lieder-Ordners („Titel [abc123…]“) nicht im Titel anzeigen
function stripId(t){ return String(t || "").replace(/\s*\[[a-z0-9]{8,}\]\s*$/i, "").trim(); }
function cleanTitles(){ for (const s of songs()) { const c = stripId(s.title); if (c && c !== s.title) { s.title = c; save(s); } } }

/* ---------- Lautstärke-Fenster ---------- */
const curVol = () => (isRemote() && R.mirror && R.mirror.vol) ? R.mirror.vol : vol;
const pct = v => Math.round(v * 100) + " %";
function renderLevels(){
  const t = $("#lvlTxt"); if (!t) return; const v = curVol();
  const m = midiState(); const dot = m === "off" ? "" : `<i class="mi ${m === "on" ? "on" : ""}" id="midiDot" title="${m === "on" ? "MIDI verbunden: " + esc(midiNames()) : "MIDI: kein Gerät"}"></i>`;
  t.innerHTML = `${dot}<span>Ges <b>${Math.round(v.m*100)}</b></span> · <span class="lp">Prog <b>${Math.round(v.p*100)}</b></span> · <span class="le">Einw <b>${Math.round(v.e*100)}</b></span>`;
  $("#bMix")?.classList.toggle("on", v.m < 1 || v.p < 1 || v.e < 1);
  const sh = document.querySelector("#mixSheet") ? document : null; if (sh) for (const ch of ["m","p","e"]) { const r = sh.querySelector("#mx_" + ch); if (r && document.activeElement !== r) r.value = Math.round(v[ch] * 100); const b = sh.querySelector("#mxv_" + ch); if (b) b.textContent = pct(v[ch]); }
}
function mixSheet(){
  const v = curVol();
  const row = (ch, label, sub) => `<div class="mixrow ${ch}"><span class="ml">${label}<small>${sub}</small></span><input type="range" id="mx_${ch}" min="0" max="100" step="1" value="${Math.round(v[ch]*100)}" aria-label="${label}"><b id="mxv_${ch}">${pct(v[ch])}</b></div>`;
  sheet(`<h4 id="mixSheet">Lautstärke</h4>
    ${row("m", "Gesamt", midiLabel("volM") || "alles")}
    ${row("p", "Programm", midiLabel("volP") || "Programm & Ablauf")}
    ${row("e", "Einwürfe", midiLabel("volE") || "Einwürfe")}
    <p>Programm und Einwürfe lassen sich getrennt einstellen – z. B. Programm auf 60 % als Hintergrund, Einwürfe auf 100 %, damit sie deutlich herauskommen. Die Regler wirken hörgerecht: 50 % ist schon spürbar leiser. ${midiSupported() ? "Am MIDI-Pad legst du die Fader unter Einstellungen → MIDI-Pad fest." : ""}</p>
    <div class="acts"><button class="sec" data-a="mx100" style="margin-right:auto">Alle auf 100 %</button><button class="pri" data-a="close">Fertig</button></div>`,
  a => {
    if (a==="close") return true;
    if (a==="mx100") { for (const ch of ["m","p","e"]) setLevel(ch, 1); return; }
  }, root => {
    for (const ch of ["m","p","e"]) root.querySelector("#mx_" + ch).addEventListener("input", ev2 => setLevel(ch, +ev2.target.value / 100));
  });
}
$("#bMix").addEventListener("click", mixSheet);

/* ---------- MIDI-Pad (Web MIDI: Edge/Chrome am PC/Laptop) ---------- */
// Belegung pro Gerät: Aktion -> Code ("n:Kanal:Note", "c:Kanal:CC", "p:Kanal" = Pitch-Fader, "g:Kanal:Programm")
const MIDI_BTNS = [...ACTIONS.filter(a => a[0] !== "help"), ["auto","Auto weiter an/aus"], ["mix","Lautstärke-Fenster öffnen"], ["help","Einstellungen öffnen"]];
const MIDI_FADERS = [["volM","Gesamtlautstärke","m"], ["volP","Lautstärke Programm & Ablauf","p"], ["volE","Lautstärke Einwürfe","e"]];
const midiSupported = () => !!navigator.requestMIDIAccess;
function midiInputs(){ return midiAcc ? [...midiAcc.inputs.values()].filter(i => i.state !== "disconnected") : []; }
const midiNames = () => midiInputs().map(i => i.name).join(", ");
const midiState = () => !midiSupported() || !midiOn ? "off" : midiInputs().length ? "on" : "none";
function midiName(c){
  if (!c) return "";
  const [t, ch, n] = c.split(":"); const kn = +ch ? " · K" + (+ch + 1) : "";
  if (t === "n") return "Pad/Note " + n + kn;
  if (t === "c") return "Regler CC " + n + kn;
  if (t === "p") return "Pitch-Fader" + kn;
  if (t === "g") return "Programm " + n + kn;
  return c;
}
const midiLabel = id => midiName(midimap[id]);
function midiSaveMap(){ ls.set("midi", midimap); }
async function midiStart(ask){
  if (!midiSupported()) return false;
  try {
    midiAcc = await navigator.requestMIDIAccess({sysex: false});
    midiErr = "";
    const hook = () => { for (const i of midiAcc.inputs.values()) i.onmidimessage = midiMsg; renderLevels(); const ms = document.querySelector("#midiStat"); if (ms) ms.innerHTML = midiStatHtml(); };
    midiAcc.onstatechange = ev2 => { hook(); if (ev2.port && ev2.port.type === "input" && midiOn) toast(ev2.port.state === "connected" ? "MIDI-Gerät verbunden: " + ev2.port.name : "MIDI-Gerät getrennt: " + ev2.port.name); };
    hook(); return true;
  } catch (er) { midiAcc = null; midiErr = "Zugriff auf MIDI wurde nicht erlaubt."; if (ask) toast(midiErr + " In der Adresszeile auf das Schloss-Symbol → MIDI erlauben.", 6000); renderLevels(); return false; }
}
function midiStop(){ if (midiAcc) for (const i of midiAcc.inputs.values()) i.onmidimessage = null; midiAcc = null; renderLevels(); }
function midiFlash(){ const d = document.querySelector("#midiDot"); if (!d) return; d.classList.add("hit"); clearTimeout(midiFlash.t); midiFlash.t = setTimeout(() => d.classList.remove("hit"), 120); }
// Eine MIDI-Nachricht in {code, kind, val} übersetzen. kind: "press" (Taste gedrückt) oder "value" (Fader/Regler 0…1)
function midiParse(data){
  const st = data[0], d1 = data[1] ?? 0, d2 = data[2] ?? 0; if (st >= 0xF0) return null;
  const t = st & 0xF0, ch = st & 0x0F;
  if (t === 0x90 && d2 > 0) return {code: `n:${ch}:${d1}`, kind: "press"};
  if (t === 0x80 || t === 0x90) return {code: `n:${ch}:${d1}`, kind: "release"};
  if (t === 0xB0) { const code = `c:${ch}:${d1}`, last = ccLast.get(code) ?? 0; ccLast.set(code, d2); return {code, kind: "value", val: d2 / 127, up: d2 >= 64 && last < 64}; }
  if (t === 0xE0) return {code: `p:${ch}`, kind: "value", val: ((d2 << 7) | d1) / 16383};
  if (t === 0xC0) return {code: `g:${ch}:${d1}`, kind: "press"};
  return null;
}
function midiMsg(ev2){
  const m = midiParse(ev2.data); if (!m || m.kind === "release") return;
  midiFlash();
  if (midiCap) { if (midiCap(m)) midiCap = null; return; }
  // Fader / Drehregler
  if (m.kind === "value") { const f = MIDI_FADERS.find(x => midimap[x[0]] === m.code); if (f) { setLevel(f[2], m.val); return; } }
  const pressed = m.kind === "press" || (m.kind === "value" && m.up);
  if (!pressed) return;
  const b = MIDI_BTNS.find(x => midimap[x[0]] === m.code);
  if (b) { unlock(); midiRun(b[0]); return; }
  midiPool(m.code);
}
function midiRun(id){
  const sheetOpen = !!$("#layer").firstChild;
  // Transport geht immer, auch wenn ein Fenster offen ist
  const transport = ["play","next","restart","fade","stop","auto","fadeUp","fadeDn"];
  if (sheetOpen && !transport.includes(id)) { if (id === "mix" || id === "help") closeSheet(); else return; }
  if (id === "auto") { $("#bAuto").click(); return; }
  if (id === "mix") { mixSheet(); return; }
  runAction(id);
}
// Einwürfe: eigenes Pad am Einwurf, sonst Pad-Reihe ab „erstem Einwurf-Pad“ in Reihenfolge der Einwürfe
function midiPoolMap(e){
  const res = new Map(), used = new Set(Object.entries(midimap).filter(([k, v]) => k !== "poolBase" && v).map(([, v]) => v));
  e.pool.forEach(it => { if (it.midi && it.midi !== "none" && !used.has(it.midi)) { res.set(it.midi, it.k); used.add(it.midi); } });
  const base = midimap.poolBase;
  if (base && base.startsWith("n:")) {
    const [, ch, n0] = base.split(":"); let n = +n0;
    for (const it of e.pool) { if (it.midi) continue; while (n < 128 && used.has(`n:${ch}:${n}`)) n++; if (n >= 128) break; res.set(`n:${ch}:${n}`, it.k); used.add(`n:${ch}:${n}`); n++; }
  }
  return res;
}
function midiPoolLabel(e, it){ for (const [c, k] of midiPoolMap(e)) if (k === it.k) return midiName(c) + (it.midi ? "" : ", automatisch"); return "keins"; }
function midiPool(code){
  const e = ev(); if (!e) return;
  const k = midiPoolMap(e).get(code); if (!k) return;
  unlock(); playNow(k);
}
function midiPoolSheet(e, it, s){
  sheet(`<h4>MIDI-Pad für „${esc(s.title)}“</h4>
    <p>${midiState() === "on" ? "Drück jetzt das gewünschte Pad am MIDI-Gerät." : "Kein MIDI-Gerät verbunden. Unter Einstellungen → MIDI-Pad einschalten und Gerät anschließen."}</p>
    <div style="display:flex;gap:10px;align-items:center"><span class="lbl2">Jetzt:</span><kbd id="mpNow" style="font-size:14px;height:30px;padding:0 10px">${esc(midiPoolLabel(e, it))}</kbd></div>
    <div class="acts"><button class="sec" data-a="auto" style="margin-right:auto">Automatisch</button><button class="sec" data-a="none">Ohne Pad</button><button class="pri" data-a="close">Fertig</button></div>`,
  a => {
    if (a==="auto") { delete it.midi; save(e); render(); return true; }
    if (a==="none") { it.midi = "none"; save(e); render(); return true; }
    return true;
  });
  midiCap = m => {
    if (m.kind !== "press" && !(m.kind === "value" && m.up)) return false;
    const b = [...MIDI_BTNS, ...MIDI_FADERS].find(x => midimap[x[0]] === m.code);
    if (b) { toast(`${midiName(m.code)} ist schon belegt: ${b[1]}.`); return false; }
    e.pool.forEach(o => { if (o !== it && o.midi === m.code) delete o.midi; });
    it.midi = m.code; save(e); render();
    const n = document.querySelector("#mpNow"); if (n) n.textContent = midiName(m.code);
    toast(`${midiName(m.code)} gespeichert.`);
    return false; // weiter lauschen, bis „Fertig“
  };
}
function midiStatHtml(){
  if (!midiOn) return "MIDI ist aus.";
  if (midiErr) return esc(midiErr);
  const ins = midiInputs();
  return ins.length ? `Verbunden: <b style="color:var(--fg)">${esc(ins.map(i => i.name).join(", "))}</b>` : "Eingeschaltet – aber kein MIDI-Gerät gefunden. Pad per USB anschließen (ggf. vorher den Treiber/die Software des Herstellers schließen).";
}
function midiList(){
  const btn = (id, label) => `<dt><button type="button" class="kbtn" data-a="midil:${id}" title="Neu zuweisen">${midimap[id] ? `<kbd>${esc(midiName(midimap[id]))}</kbd>` : `<span class="lbl2">keine</span>`}</button>${midimap[id] ? `<button type="button" class="kbtn" data-a="midix:${id}" title="Entfernen" style="min-width:0">✕</button>` : ""}</dt><dd>${esc(label)}</dd>`;
  return `<dl class="hk">${MIDI_FADERS.map(f => btn(f[0], f[1] + " (Fader/Regler)")).join("")}${btn("poolBase", "Erstes Einwurf-Pad – die folgenden Pads spielen die Einwürfe der Reihe nach")}${MIDI_BTNS.map(b => btn(b[0], b[1])).join("")}</dl>`;
}
function midiSection(){
  if (!midiSupported()) return `<span class="lbl2">MIDI-Pad</span><p>Dieser Browser kann kein MIDI (iPhone/iPad/Safari). Am Laptop oder PC mit Edge oder Chrome geht es. Vom iPad aus steuerst du dann über die Fernbedienung.</p>`;
  return `<span class="lbl2">MIDI-Pad (Edge/Chrome am PC) – zum Zuweisen antippen, dann Pad/Fader am Gerät bewegen</span>
    <label class="chkrow"><input type="checkbox" id="midiOnChk" ${midiOn ? "checked" : ""}> MIDI-Steuerung einschalten</label>
    <p id="midiStat">${midiStatHtml()}</p>
    ${midiOn ? `<p id="midiHint" hidden style="color:var(--amber);font-weight:600"></p>
    <div id="midiWrap">${midiList()}</div>
    <p>Tipp: Nach dem Öffnen der App einmal irgendwo hinklicken – erst dann darf der Browser Ton abspielen. Die Belegung gilt für dieses Gerät.</p>
    <div class="acts" style="justify-content:flex-start"><button class="sec" data-a="midiclear">MIDI-Belegung löschen</button></div>` : ""}`;
}
function midiSettingsAct(a, root){
  const refresh = () => { const w = root.querySelector("#midiWrap"); if (w) w.innerHTML = midiList(); };
  const hint = root.querySelector("#midiHint");
  if (a === "midiclear") { confirmSheet("MIDI-Belegung löschen?", "Alle Pads und Fader sind danach nicht mehr zugewiesen.", "Löschen", () => { midimap = {}; midiSaveMap(); settingsSheet(); }); return; }
  if (a.startsWith("midix:")) { delete midimap[a.slice(6)]; midiSaveMap(); refresh(); render(); return; }
  if (a.startsWith("midil:")) {
    const id = a.slice(6), fader = MIDI_FADERS.find(f => f[0] === id), btn = MIDI_BTNS.find(b => b[0] === id);
    const label = fader ? fader[1] : btn ? btn[1] : "Erstes Einwurf-Pad";
    if (midiState() !== "on") { toast("Kein MIDI-Gerät verbunden."); return; }
    root.querySelectorAll(".kbtn").forEach(b => b.classList.toggle("wait", b.dataset.a === a));
    if (hint) { hint.hidden = false; hint.textContent = fader ? `Bewege jetzt den Fader/Regler für „${label}“ … (Esc = abbrechen)` : `Drück jetzt das Pad/die Taste für „${label}“ … (Esc = abbrechen)`; }
    midiCap = m => {
      if (fader) { if (m.kind !== "value") { toast("Das war eine Taste – bitte einen Fader oder Drehregler bewegen."); return false; } }
      else if (id === "poolBase") { if (!m.code.startsWith("n:") || m.kind !== "press") { toast("Bitte ein Pad drücken, das eine Note sendet."); return false; } }
      else if (!(m.kind === "press" || (m.kind === "value" && m.up))) return false;
      for (const k of Object.keys(midimap)) if (k !== id && midimap[k] === m.code) { const o = [...MIDI_BTNS, ...MIDI_FADERS].find(x => x[0] === k); toast(`${midiName(m.code)} war für „${o ? o[1] : "Erstes Einwurf-Pad"}“ belegt – dort jetzt entfernt.`, 4000); delete midimap[k]; }
      midimap[id] = m.code; midiSaveMap();
      if (hint) hint.hidden = true; refresh(); render();
      return true;
    };
    return;
  }
}
// Schalter in den Einstellungen
document.addEventListener("change", async ev2 => {
  if (ev2.target && ev2.target.id === "midiOnChk") {
    midiOn = ev2.target.checked; ls.set("midiOn", midiOn);
    if (midiOn) { const ok = await midiStart(true); if (ok) toast(midiInputs().length ? "MIDI an: " + midiNames() : "MIDI an – noch kein Gerät gefunden."); }
    else midiStop();
    if ($("#layer").firstChild && document.querySelector("#midiOnChk")) settingsSheet();
  }
});
if (midiOn && midiSupported()) midiStart(false);

async function boot(){
  try { idb = await idbOpen(); for (const r of await iGetAll("recs")) recs.set(r.id, r); for (const k of await iKeys("audio")) audioKeys.add(k); }
  catch { idb = null; toast("Dieser Browser speichert nichts dauerhaft (privates Fenster?)."); }
  try { navigator.storage?.persist?.(); } catch {}
  cleanTitles();
  if (!ev()) { curEv = events()[0]?.id || null; }
  render();
  const red = await auth.handleRedirect();
  if (red?.ok) { toast("Mit OneDrive verbunden."); sessionStorage.removeItem("sp-silent"); }
  else if (red?.error && !red.silent && red.error !== "access_denied") toast("Anmeldung fehlgeschlagen: " + String(red.desc || red.error).split("\n")[0], 6000);
  else if (red?.error === "access_denied") toast("Anmeldung abgebrochen.");
  // Neues Gerät: automatisch anmelden. Ist der Browser bei Microsoft schon angemeldet, geht das ohne Eingabe.
  if (!red && auth.clientId() && !auth.connected() && navigator.onLine && !sessionStorage.getItem("sp-auto")) { sessionStorage.setItem("sp-auto", "1"); auth.login(true); return; }
  if (idb) { try { const h = await iGet("kv", "dir"); if (h) { dirHandle = h; await connectDir(h, false); } } catch {} }
  setSync();
  if (auth.connected()) odRun();
  setRc(); if (isRemote()) remoteConnect();
  return;
  try {
    const [db, user, as] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
    assets = as || null;
    const id = user ? await user.id() : null;
    if (db && id) {
      coll = db.collection("data/users/" + id);
      try {
        const snap = await coll.get();
        const remote = new Map(); snap.docs.forEach(d => { const x = d.data(); if (x) remote.set(d.id, x); });
        for (const [, d] of remote) mergeRemote(d);
        for (const r of recs.values()) { const rd = remote.get(r.id); if (!rd || (r.updated||0) > (rd.updated||0)) dirty.add(r.id); }
        ls.set("dirty", [...dirty]);
      } catch { syncErr = true; }
      coll.onSnapshot(qs => { let ch = false; qs.docChanges().forEach(c => { if (c.type !== "removed") ch = mergeRemote(c.doc.data()) || ch; }); if (ch) { if (!ev()) curEv = events()[0]?.id || null; render(); } }, () => { syncErr = true; setSync(); });
      if (!ev()) curEv = events()[0]?.id || null;
      render(); flush(); uploadLoop();
    }
  } catch { setSync(); }
}
boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
